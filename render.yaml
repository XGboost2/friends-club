services:
  - type: web
    name: friends-club
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLUB_TIMEZONE
        value: Europe/Prague
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://friends-club.cz
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
